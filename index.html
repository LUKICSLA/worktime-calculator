<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculate your workday end time easily with the Worktime calculator - just enter your arrival time, overtime, and work duration">
  <meta name="keywords" content="worktime calculator, work hours, time tracker, calculate end of work, working hours">
  <meta name="author" content="Lukáš Maár">
  <title>Worktime calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Worktime calculator</h2>

    <label for="arrival">Arrival time</label>
    <input type="time" id="arrival" required>

    <label for="overtime">Overtime</label>
    <input type="time" id="overtime" value="00:00">

    <label for="worklength">Work duration</label>
    <select id="worklength" onchange="toggleCustomInput()">
      <option value="8">8 hours</option>
      <option value="8.5" selected>8.5 hours</option>
      <option value="9">12 hours</option>
      <option value="custom">Custom</option>
    </select>

    <input type="number" step="0.1" id="customWorklength" placeholder="Enter custom work duration" style="display:none;" min="0">

    <button onclick="calculateLeaveTime()">Calculate</button>
    <div id="result"></div>
  </div>
  <script src="calculator.js"></script>
  <footer class="license-banner">
  <p>This work is licensed under the <a href="https://github.com/LUKICSLA/worktime-calculator/blob/production/LICENSE" target="_blank" rel="noopener">MIT License</a>.</p>
</footer>
</body>
</html>
